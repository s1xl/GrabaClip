name: Compilar y publicar

# Se ejecuta cuando cambia el archivo VERSION en main (publica esa version),
# al subir una etiqueta vX.Y.Z, o a mano desde la pestana Actions.
on:
  push:
    branches: [main]
    paths: [VERSION]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # para crear la Release

jobs:
  compilar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Leer la version
        id: version
        run: echo "v=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Comprobar que la etiqueta coincide con VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v${{ steps.version.outputs.v }}" = "$GITHUB_REF_NAME"

      - name: Cache de descargas (compilador, Python, FFmpeg)
        uses: actions/cache@v4
        with:
          path: .cache
          key: descargas-${{ hashFiles('build/build.sh') }}

      - name: Instalar NSIS (para el instalador)
        run: sudo apt-get update -q && sudo apt-get install -y -q nsis

      - name: Compilar y armar el paquete
        run: ./build/build.sh

      # ---------- firma con SignPath (solo cuando el proyecto ya fue aprobado) ----------
      - name: Separar los ejecutables a firmar
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          mkdir -p sin-firmar
          cp dist/GrabaClip/GrabaClip.exe dist/GrabaClip/audiocap.exe sin-firmar/

      - name: Subir ejecutables sin firmar
        id: sin-firmar
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ejecutables-sin-firmar
          path: sin-firmar/

      - name: Firmar con SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'GrabaClip' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.sin-firmar.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: firmado

      - name: Volver a armar el zip con los ejecutables firmados
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          cp firmado/GrabaClip.exe firmado/audiocap.exe dist/GrabaClip/
          V="$(tr -d ' \r\n' < VERSION)"
          cd dist && rm -f "GrabaClip-v$V-portable.zip" && zip -qr -9 "GrabaClip-v$V-portable.zip" GrabaClip
          makensis -V2 -DVERSION="$V" -DORIGEN="$PWD/GrabaClip" -DSALIDA="$PWD/GrabaClip-v$V-instalador.exe" ../build/instalador.nsi

      # ---------- publicar ----------
      - name: Guardar el paquete
        uses: actions/upload-artifact@v4
        with:
          name: GrabaClip-portable
          path: |
            dist/*.zip
            dist/*.exe

      - name: Crear la Release (y su etiqueta vX.Y.Z)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.v }}
          target_commitish: ${{ github.sha }}
          name: GrabaClip ${{ steps.version.outputs.v }}
          files: |
            dist/*.zip
            dist/*.exe
          generate_release_notes: true
          body: |
            ## Descarga
            - **Instalador:** **GrabaClip-v${{ steps.version.outputs.v }}-instalador.exe**. Se instala sin permisos de administrador, con acceso directo en el menu Inicio y desinstalador en *Configuracion > Aplicaciones*.
            - **Portable:** **GrabaClip-v${{ steps.version.outputs.v }}-portable.zip**. Haz clic derecho > Propiedades > **Desbloquear**, descomprimelo y abre **GrabaClip.exe**. No necesita instalacion.
            Si ya tienes GrabaClip 0.11 o mas nuevo, actualiza desde *Ajustes > General > Buscar actualizaciones*.

            [Code signing policy / Politica de firma de codigo](https://github.com/s1xl/GrabaClip#code-signing-policy) · [Privacidad](https://github.com/s1xl/GrabaClip/blob/main/PRIVACIDAD.md)
